name: ✨ 기능 추가
description: 새로운 기능을 구현할 때 사용합니다.
title: "✨ Feature: "
labels: [":sparkles: Feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 📌 작업 목적
      placeholder: 왜 이 기능이 필요한가요? 한 줄로 요약해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 완료 조건
      value: |
        - [ ]
      placeholder: |
        - [ ] UI 레이아웃 구현
        - [ ] API 연동
        - [ ] 에러 처리
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: 🔗 관련 정보
      placeholder: Figma 링크, 관련 이슈 번호 등
    validations:
      required: false
